name: Generate Doxygen Documentation

on:
    push:
        tags:
            - "v*.*.*" # Rulează doar când un tag care începe cu 'v' urmat de versiune (ex: v1.0.0) este creat

jobs:
    generate-docs:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              # Asigură-te că descarci și submodulule dacă documentația include cod din ele
              with:
                  submodules: "recursive"

            - name: Install Doxygen
              run: |
                  sudo apt-get update
                  sudo apt-get install -y doxygen graphviz # Instalează doxygen și graphviz (pentru diagrame)

            - name: Generate Documentation
              run: |
                  DOXYFILE_PATH="Doxyfile" # Sau calea corectă dacă nu e în rădăcină
                  OUTPUT_PATH="doxygen_output/html" # Definește un director de ieșire clar

                  if [ -f $DOXYFILE_PATH ]; then
                    # Creează directorul de ieșire
                    mkdir -p $(dirname "$OUTPUT_PATH") 
                    # Rulează Doxygen suprascriind setările de ieșire
                    (cat $DOXYFILE_PATH; echo "OUTPUT_DIRECTORY=$(dirname $OUTPUT_PATH)"; echo "GENERATE_HTML=YES"; echo "HTML_OUTPUT=$(basename $OUTPUT_PATH)") | doxygen -
                    echo "Doxygen generation attempted into $OUTPUT_PATH"
                  else
                    echo "Doxyfile not found at $DOXYFILE_PATH. Skipping documentation generation."
                    # exit 1 
                  fi

            # Optional: List files for debugging
            - name: List generated files
              run: ls -R $(dirname "doxygen_output/html") # Listează conținutul directorului părinte

            - name: Upload Documentation Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: doxygen-documentation-${{ github.ref_name }}
                  # Folosește aceeași cale definită mai sus
                  path: doxygen_output/html/
                  if-no-files-found: warn
                  retention-days: 90
